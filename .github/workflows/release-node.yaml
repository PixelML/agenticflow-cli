name: Release & Publish

on:
  push:
    tags:
      - "cli-v*"
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to stage (for example sdk-v1.7.0 or cli-v1.12.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # npm provenance attestation

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

defaults:
  run:
    working-directory: .

jobs:
  release-cli:
    if: startsWith(inputs.release_tag || github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Extract version
        id: meta
        run: |
          VERSION="${RELEASE_TAG#cli-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 CLI v$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (dependency)
        run: npm run build --workspace=packages/sdk

      - name: Build CLI
        run: npm run build --workspace=packages/cli

      - name: Run tests
        run: npm test --workspace=packages/cli

      - name: Verify package README
        run: test -s packages/cli/README.md

      - name: Set package version
        working-directory: packages/cli
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Stage package on npm (approval required)
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --access public --provenance

      - name: Summary
        run: |
          echo "## CLI v${{ steps.meta.outputs.version }} staged — approval required" >> "$GITHUB_STEP_SUMMARY"
          echo "- @pixelml/agenticflow-cli@${{ steps.meta.outputs.version }} is awaiting review; it is not published yet." >> "$GITHUB_STEP_SUMMARY"
          echo "- Review it in npmjs.com → Staged Packages and approve with 2FA." >> "$GITHUB_STEP_SUMMARY"
          echo "- After approval, verify the npm version and create the GitHub Release for ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"

  release-sdk:
    if: startsWith(inputs.release_tag || github.ref_name, 'sdk-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Extract version
        id: meta
        run: |
          VERSION="${RELEASE_TAG#sdk-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 SDK v$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=packages/sdk

      - name: Run tests
        run: npm test --workspace=packages/sdk

      - name: Set package version
        working-directory: packages/sdk
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Stage package on npm (approval required)
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --access public --provenance

      - name: Summary
        run: |
          echo "## SDK v${{ steps.meta.outputs.version }} staged — approval required" >> "$GITHUB_STEP_SUMMARY"
          echo "- @pixelml/agenticflow-sdk@${{ steps.meta.outputs.version }} is awaiting review; it is not published yet." >> "$GITHUB_STEP_SUMMARY"
          echo "- Review it in npmjs.com → Staged Packages and approve with 2FA." >> "$GITHUB_STEP_SUMMARY"
          echo "- After approval, verify the npm version and create the GitHub Release for ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"
